name: Quick acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-native.txt -c requirements-test.txt pytest numpy embreex
      - run: python -m tools.build_native
      - run: python -c "from backend import _match_native"
      - run: python -m pytest -q tests/test_native_navigation.py tests/test_native_rays.py tests/test_native_physics.py tests/test_native_match_state.py
      - name: Check native ownership and arithmetic under sanitizers
        if: runner.os == 'Linux'
        run: |
          cmake -S native -B build/sanitizers -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DNAV_SANITIZERS=ON -DEMBREE_TEST_LIBRARY="$(python -c 'from backend.cs2_rays import _library_path; print(_library_path())')"
          cmake --build build/sanitizers --target check_navigation check_rays check_state
          ctest --test-dir build/sanitizers --output-on-failure --repeat until-fail:5
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt -r requirements-native.txt
      - run: python -m tools.build_native
      - run: python -m pytest -q
      - run: python -m backend.headless --seed 42 --ticks 1200
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone-portrait, tablet-landscape]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-test.txt
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test r0.spec.ts r1.spec.ts r2.spec.ts career.spec.ts quick-match.spec.ts competitions.spec.ts staff.spec.ts training.spec.ts scouting.spec.ts --project "${{ matrix.project }}"
      - if: matrix.project == 'phone-portrait'
        run: |
          python -m pip install -r requirements-native.txt
          python -m tools.build_native
      - if: matrix.project == 'phone-portrait'
        run: node frontend/e2e/mobile-tls.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.project }}
          path: frontend/test-results/
