name: Quick acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m backend.headless --seed 42 --ticks 1200
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone-portrait, tablet-landscape]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-test.txt
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test r0.spec.ts r1.spec.ts r2.spec.ts career.spec.ts quick-match.spec.ts competitions.spec.ts staff.spec.ts training.spec.ts --project "${{ matrix.project }}"
      - if: matrix.project == 'phone-portrait'
        run: node frontend/e2e/mobile-tls.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.project }}
          path: frontend/test-results/
