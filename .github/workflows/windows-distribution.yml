name: Windows distribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maps:
    uses: ./.github/workflows/cs2-runtime.yml

  series:
    name: Series on installed maps
    needs: maps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests/test_series.py tests/test_installed_maps.py::test_recent_checkpoints_resume_from_the_recorded_tick
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          ESPORT_CS2_QA=1 npx playwright test series.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: series-browser
          path: frontend/test-results/
  build:
    needs: maps
    name: Build Windows x64 archive
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-package.txt
      - name: Build frontend from locked dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: build/runtime-maps
      - name: Build self-contained launcher and archive
        shell: pwsh
        run: |
          python -m pip install -r requirements-package.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:ESPORT_SIM_MAPS = (Resolve-Path build/runtime-maps).Path
          python -X utf8 -m tools.check_cs2_replay
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package_windows.py
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/EsportSim-windows-x64.zip
          if-no-files-found: error

      - name: Verify Windows source launch and shared EXE profile
        shell: pwsh
        run: ./tools/windows-smoke/source.ps1 -PackagedExe dist/EsportSim/EsportSim.exe

  clean-windows:
    name: ZIP on clean Windows Server Core
    needs: build
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows-smoke
      - uses: actions/download-artifact@v8
        with:
          name: EsportSim-windows-x64.zip
          skip-decompress: true
          path: bundle
      - name: Launch packaged EXE inside stock Windows without developer runtimes
        shell: pwsh
        run: |
          $bundle = (Resolve-Path bundle).Path
          $smoke = (Resolve-Path tools/windows-smoke).Path
          Start-Service docker -ErrorAction Stop
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          do {
            docker version --format '{{.Server.Version}}' 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            if ([DateTime]::UtcNow -ge $deadline) { throw 'Windows container engine did not start.' }
            Start-Sleep -Seconds 2
          } while ($true)
          docker run --rm --isolation=process --network=none --user ContainerAdministrator `
            --mount "type=bind,source=$bundle,target=C:\bundle,readonly" `
            --mount "type=bind,source=$smoke,target=C:\smoke,readonly" `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\smoke\archive.ps1 `
            -CleanCore -Archive C:\bundle\EsportSim-windows-x64.zip
          exit $LASTEXITCODE

  windows-browser:
    name: Packaged EXE opens Windows browser
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows-smoke
      - uses: actions/download-artifact@v8
        with:
          name: EsportSim-windows-x64.zip
          skip-decompress: true
          path: bundle
      - name: Verify browser URL dispatch and loaded frontend in Edge or Chrome
        shell: powershell
        run: ./tools/windows-smoke/archive.ps1 -DesktopBrowser -Archive bundle/EsportSim-windows-x64.zip
