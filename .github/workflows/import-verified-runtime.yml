name: Pin verified runtime for source installations
on:
  push:
    branches: [feature/r5-1-staff]
    paths: ['.github/workflows/import-verified-runtime.yml']
permissions:
  contents: write
  actions: read
jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45865113348
          artifact-ids: 15139652608
          path: /tmp/verified-runtime
          merge-multiple: true
      - name: Include the nine verified map packs in the task branch
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path('/tmp/verified-runtime')
          out = Path('resources/cs2/26879581')
          out.mkdir(parents=True)
          catalog = {}
          for name in json.loads(Path('backend/data/maps_202611_tactics.json').read_bytes()):
              folder = root/name
              provenance = json.loads((folder/'provenance.json').read_bytes())
              assert provenance['map'] == name and int(provenance['steamBuild']) == 26879581
              files = sorted({'provenance.json','gameplay.json','collision.json','collision.bin',*provenance['radars']})
              with zipfile.ZipFile(out/(name+'.zip'), 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                  catalog[name] = {}
                  for file in files:
                      raw = (folder/file).read_bytes()
                      entry = zipfile.ZipInfo(file)
                      archive.writestr(entry, raw, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
                      catalog[name][file] = hashlib.sha256(raw).hexdigest()
          Path('backend/data/maps-runtime-26879581.json').write_text(json.dumps(catalog,sort_keys=True,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/cs2 backend/data/maps-runtime-26879581.json
          git commit -m 'Закрепить девять проверенных пакетов R4.1 для автономной установки'
          git push origin HEAD:refs/heads/feature/r5-1-staff
