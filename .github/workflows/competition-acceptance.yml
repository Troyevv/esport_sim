name: Extended competition acceptance
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  maps:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'r4.3-acceptance'
    uses: ./.github/workflows/cs2-runtime.yml
  lifecycle:
    runs-on: ubuntu-24.04
    needs: maps
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install -r requirements-test.txt
      - run: python -m tools.check_competition_lifecycle
