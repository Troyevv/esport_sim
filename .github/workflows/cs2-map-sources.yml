name: CS2 source geometry
on:
  pull_request:
    paths:
      - 'backend/cs2_*.py'
      - 'backend/match*.py'
      - tests/test_installed_maps.py
      - frontend/e2e/real-maps.spec.ts
      - tools/check_cs2_matches.py
      - backend/data/maps_202611_tactics.json
      - tests/test_cs2_spatial.py
      - tools/check_cs2_playable_areas.py
      - tools/cs2_ci_shared_models.py
      - tools/cs2_map_sources.py
      - tools/cs2_world_sources.py
      - 'tools/cs2_export/**'
      - tools/check_cs2_navigation.py
      - tools/cs2_floor_probe.py
      - .github/workflows/cs2-map-sources.yml
      - .github/workflows/cs2-runtime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    uses: ./.github/workflows/cs2-runtime.yml

  matches:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        map: [de_ancient, de_anubis, de_cache, de_dust2, de_inferno, de_mirage, de_nuke, de_train, de_vertigo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install -r requirements.txt
      - run: python -m tools.check_cs2_matches --map "${{ matrix.map }}" --games 24 --out build/match-qa
      - uses: actions/upload-artifact@v4
        with:
          name: match-qa-${{ matrix.map }}
          path: build/match-qa/

  integration:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install -r requirements-test.txt
      - name: Check saves, careers and tactic previews with installed geometry
        run: python -m pytest -vq tests/test_installed_maps.py
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          ESPORT_CS2_QA=1 npx playwright test real-maps.spec.ts --project desktop --project phone-portrait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-map-radar-screens
          path: frontend/test-results/
