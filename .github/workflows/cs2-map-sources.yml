name: CS2 source geometry
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    uses: ./.github/workflows/cs2-runtime.yml

  matches:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        map: [de_ancient, de_anubis, de_cache, de_dust2, de_inferno, de_mirage, de_nuke, de_train, de_vertigo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - name: Preserve the exact geometry used by this replay
        uses: actions/upload-artifact@v4
        with:
          name: geometry-${{ matrix.map }}
          path: runtime-data/maps/26879581/${{ matrix.map }}/
          retention-days: 3
          if-no-files-found: error
      - run: python -m pip install -r requirements.txt
      - run: python -m tools.check_cs2_matches --map "${{ matrix.map }}" --games 24 --out build/match-qa
      - uses: actions/upload-artifact@v4
        with:
          name: match-qa-${{ matrix.map }}
          path: build/match-qa/

  tactical:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        map: [de_ancient, de_anubis, de_cache, de_dust2, de_inferno, de_mirage, de_nuke, de_train, de_vertigo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install -r requirements.txt
      - name: Compare lineups with reversed starting sides
        run: python -m tools.cs2_tactical_audit --map "${{ matrix.map }}" --pairs 12 --seed 41000 --out build/tactical/paired
      - name: Independent lineups and seeds
        run: python -m tools.cs2_tactical_audit --map "${{ matrix.map }}" --pairs 8 --seed 59000 --out build/tactical/independent
      - uses: actions/upload-artifact@v4
        with:
          name: tactical-${{ matrix.map }}
          path: build/tactical/

  skills:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        map: [de_ancient, de_anubis, de_cache, de_dust2, de_inferno, de_mirage, de_nuke, de_train, de_vertigo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install -r requirements.txt
      - name: Play controlled profiles with both starting sides and held-out rosters
        run: python -m tools.cs2_skill_audit --map "${{ matrix.map }}" --seeds 41000 41001 59000 59001 --out build/skills/results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ matrix.map }}
          path: build/skills/results.jsonl

  integration:
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install -r requirements-test.txt
      - name: Verify the recorded cross-CPU replay positions
        run: python -m tools.check_cs2_replay
      - name: Check saves, careers and tactic previews with installed geometry
        run: python -m pytest -vq --capture=tee-sys tests/test_installed_maps.py
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          ESPORT_CS2_QA=1 npx playwright test real-maps.spec.ts --project desktop --project phone-portrait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-map-radar-screens
          path: frontend/test-results/

  movement:
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-runtime-26879581
          path: runtime-data/maps/26879581
      - run: python -m pip install numpy==2.5.5 embreex==4.4.0.post1
      - name: Identify physical contacts along NAV routes
        run: |
          for map in de_vertigo de_nuke de_dust2 de_cache de_ancient de_train de_mirage de_anubis de_inferno; do
            python -m tools.check_cs2_motion --map "$map"
          done
