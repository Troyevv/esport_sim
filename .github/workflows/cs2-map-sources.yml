name: CS2 source geometry
on:
  pull_request:
    paths:
      - tools/cs2_map_sources.py
      - tools/check_cs2_navigation.py
      - .github/workflows/cs2-map-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: awpy==3.3.1
      - run: python tools/cs2_map_sources.py --download build/cs2
      - run: python tools/check_cs2_navigation.py build/cs2
