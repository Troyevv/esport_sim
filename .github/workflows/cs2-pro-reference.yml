name: CS2 professional reference
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cs2-pro-reference.yml
      - tools/cs2_pro_reference.py
      - tools/cs2_pro_demo.py
      - tools/cs2_cache_reference.py
      - tools/cs2_archive_reference.py
      - frontend/e2e/capture-pro-cache.cjs
      - tools/cs2_tournament_reference.py
permissions:
  contents: read
jobs:
  economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow
      - run: python -m tools.cs2_pro_reference --out build/pro-reference
      - uses: actions/upload-artifact@v4
        with:
          name: cs2-pro-reference
          path: build/pro-reference/
  demos:
    needs: economy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        map: [de_ancient, de_anubis, de_dust2, de_inferno, de_mirage, de_nuke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cs2-pro-reference
          path: build/pro-reference
      - run: python -m pip install pyarrow pandas demoparser2==0.42.0
      - run: python -m tools.cs2_pro_demo --map "${{ matrix.map }}" --dir build/pro-reference
      - uses: actions/upload-artifact@v4
        with:
          name: pro-utility-${{ matrix.map }}
          path: build/pro-reference/*-utility.json
  historic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m tools.cs2_tournament_reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-tournament-rounds
          path: build/pro-tournaments/

  archive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        map: [de_train, de_vertigo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow pandas demoparser2==0.42.0
      - run: python -m tools.cs2_archive_reference --map "${{ matrix.map }}" --out build/historic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historic-utility-${{ matrix.map }}
          path: build/historic/*

  cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: node frontend/e2e/capture-pro-cache.cjs build/cache-replay
      - run: python -m tools.cs2_cache_reference --dir build/cache-replay --out build/de_cache-utility.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-utility-de_cache
          path: build/de_cache-utility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-cache-opening
          path: build/cache-replay/early/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-cache-closing
          path: build/cache-replay/late/
